name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "使用 $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: 安装 XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        working-directory: ios
        run: xcodegen generate

      - name: 单元测试 + 界面截图
        working-directory: ios
        run: bash ci/test-and-screenshot.sh

      - name: 编译未签名 IPA
        working-directory: ios
        run: bash ci/build-ipa.sh

      # IPA 和截图发布到本仓库的 Release「ios-latest」（每次覆盖）。
      # Release 附件不占用 Actions 的 Artifact 存储额度。
      - name: 发布到 Release（ios-latest）
        working-directory: ios/build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd screenshots && zip -qr ../screenshots.zip .)
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest DailyMemo-unsigned.ipa screenshots.zip \
            --target "${{ github.sha }}" --prerelease \
            --title "今日事 iOS 最新构建" \
            --notes "提交 ${{ github.sha }} 编译的未签名 IPA。下载 DailyMemo-unsigned.ipa 后用 Sideloadly / AltStore / 自己的证书签名安装。screenshots.zip 是模拟器截图。"

      - name: 上传日志（失败时）
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ios/build/logs
          retention-days: 3
          if-no-files-found: ignore
