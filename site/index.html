<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日事</title>
<style>
  :root { --brand: #4c6ef5; --text: #1f2328; --sub: #5b6270; --bg: #f5f6fa; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --text: #eceef2; --sub: #a3a9b5; --bg: #16171b; --card: #22242a; --brand: #7b93ff; } }
  body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  .card { background: var(--card); border-radius: 16px; padding: 28px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  h1 { margin: 0 0 4px; font-size: 32px; }
  .tag { color: var(--sub); margin: 0 0 24px; }
  li { margin: 6px 0; }
  a { color: var(--brand); }
  footer { color: var(--sub); font-size: 14px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>今日事</h1>
    <p class="tag">每天要做的事，一眼看清</p>
    <p>今日事是一个个人自用的每日备忘应用，有 Windows 和 iPhone 两个版本：</p>
    <ul>
      <li>把 Google 日历、Google Tasks、iPhone「日历」和「提醒事项」放在一起，显示今天要做的事；</li>
      <li>Windows 桌面小组件、iPhone 主屏幕和锁屏小组件，待办可以直接打勾；</li>
      <li>每天早上推送当天安排，日程开始前提醒；</li>
      <li>电脑和手机通过用户自己的 Google 账号同步。</li>
    </ul>
    <p><a href="privacy.html">隐私说明</a></p>
  </div>
  <footer>个人项目，不对外分发。</footer>
</main>
</body>
</html>
